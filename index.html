<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1b5e">
  <!-- Sécurité : la page ne peut charger que ses propres fichiers, et ne peut contacter qu'ElevenLabs
       (voix premium optionnelle). Aucun autre serveur ne peut recevoir de données, même en cas de faille. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self' https://api.elevenlabs.io; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Famili'Quiz</title>
  <meta name="description" content="Le grand quiz de la famille, adapté à chaque âge.">

  <!-- Application installable (iPad / iPhone / Android) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Famili'Quiz">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg"></div>
  <main id="app"></main>
  <div id="sound-bar">
    <button id="btnMusic" title="Musique on/off">🎵</button>
    <button id="btnSfx" title="Bruitages on/off">🔊</button>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>

  <!-- Données : questions texte -->
  <script src="data/categories.js"></script>
  <script src="data/questions/geo.js"></script>
  <script src="data/questions/histoire.js"></script>
  <script src="data/questions/sport.js"></script>
  <script src="data/questions/animaux.js"></script>
  <script src="data/questions/ecran.js"></script>
  <script src="data/questions/sciences.js"></script>
  <script src="data/questions/espace.js"></script>
  <script src="data/questions/musique.js"></script>
  <script src="data/questions/cuisine.js"></script>
  <script src="data/questions/arts.js"></script>
  <script src="data/questions/jeux.js"></script>
  <script src="data/questions/nature.js"></script>

  <!-- Données : questions photo (images Wikimedia Commons) -->
  <script src="data/photos/geo.js"></script>
  <script src="data/photos/histoire.js"></script>
  <script src="data/photos/sport.js"></script>
  <script src="data/photos/animaux.js"></script>
  <script src="data/photos/sciences.js"></script>
  <script src="data/photos/espace.js"></script>
  <script src="data/photos/musique.js"></script>
  <script src="data/photos/cuisine.js"></script>
  <script src="data/photos/arts.js"></script>
  <script src="data/photos/nature.js"></script>

  <!-- Lectures enregistrées (voix Piper « siwis ») -->
  <script src="data/voice.js"></script>

  <!-- Application -->
  <script src="js/store.js"></script>
  <script src="js/eleven.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
